schema_version = 1
last_reviewed = "2026-07-30"

[[claims]]
id = "C-DYN-001"
status = "established"
evidence_type = "sourced_fact"
statement = "Basin stabilityは、明示した初期条件分布から対象アトラクタへ到達する確率として定義できる。"
sources = ["https://doi.org/10.1038/nphys2516"]
implementations = ["src/reservoir_dynamics/metrics/basin.py"]
tests = ["tests/metrics/test_basin.py"]
limitations = [
  "値は初期条件分布、探索領域、有限観測時間、アトラクタ分類器に依存する。",
  "発見していないアトラクタへの確率質量は推定を歪める。",
]

[[claims]]
id = "C-STAT-001"
status = "established"
evidence_type = "sourced_fact"
statement = "有限標本のbinomial比率にはWilson score intervalを用いることで、Wald区間の境界付近の病的挙動を避けられる。"
sources = ["https://doi.org/10.1080/01621459.1927.10502953"]
implementations = ["src/reservoir_dynamics/metrics/basin.py"]
tests = ["tests/metrics/test_basin.py"]
limitations = [
  "独立同分布の初期条件標本を仮定する。",
  "軌道分類誤差と数値積分誤差はこの区間に含まれない。",
]

[[claims]]
id = "C-DYN-002"
status = "provisional"
evidence_type = "inference"
statement = "吸引確率のShannon entropyの指数は、偏った吸引域を割り引く実効アトラクタ数として利用できる。"
sources = ["https://doi.org/10.1111/j.2006.0030-1299.14714.x"]
implementations = ["src/reservoir_dynamics/metrics/repertoire.py"]
tests = ["tests/metrics/test_repertoire.py"]
limitations = [
  "Hill numberの力学系への適用であり、リザバー性能との関係は未検証である。",
  "初期条件分布が変われば実効個数も変わる。",
]
falsification_criteria = [
  "吸引域の不均衡を操作した連想記憶実験で、生の個数より予測力が一貫して劣る。",
]

[[claims]]
id = "C-RC-001"
status = "established"
evidence_type = "sourced_fact"
statement = "同一入力を与えた異なる初期状態間の距離は、入力条件付き応答の再現性を測る観測量になる。"
sources = [
  "https://doi.org/10.1162/NECO_a_00411",
  "https://doi.org/10.1016/j.physd.2020.132609",
]
implementations = ["src/reservoir_dynamics/metrics/replica.py"]
tests = ["tests/metrics/test_replica.py"]
limitations = [
  "有限時間の距離減衰だけでは大域的ESPを証明できない。",
  "入力実現、初期状態分布、距離尺度に依存する。",
]

[[claims]]
id = "C-RC-002"
status = "established"
evidence_type = "sourced_fact"
statement = "Dambre型IPCの総和は、その定理の仮定下でアクセス可能な独立状態次元により上から抑えられる。"
sources = ["https://doi.org/10.1038/srep00514"]
limitations = [
  "入力分布、直交基底、線形読み出し、無限データ等の仮定を外した一般性能上限ではない。",
]

[[claims]]
id = "C-RC-003"
status = "provisional"
evidence_type = "sourced_fact"
statement = "Generalized RCでは、状態が同一入力へ再現応答しない場合でも、履歴を持つ時間不変読み出しにより再現可能な出力を構成できる場合がある。"
sources = ["https://arxiv.org/abs/2412.12104"]
limitations = [
  "2026-07-30時点で確認した公開版は査読前プレプリントである。",
  "必要情報の可観測性、読み出し表現力、有限データ学習を保証しない。",
]

[[claims]]
id = "C-RC-004"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "スカラーtanhリザバーで|a|<1のとき、同一入力を受ける複製間距離はD_t <= |a|^t D_0を満たすことを本ツールで再現した。"
sources = ["https://doi.org/10.1016/j.neunet.2012.07.005"]
implementations = [
  "src/reservoir_dynamics/simulation/discrete.py",
  "src/reservoir_dynamics/systems/scalar_tanh.py",
  "src/reservoir_dynamics/theory/contraction.py",
  "src/reservoir_dynamics/experiments/scalar_tanh_contraction.py",
]
tests = [
  "tests/simulation/test_discrete.py",
  "tests/systems/test_scalar_tanh.py",
  "tests/theory/test_contraction.py",
  "tests/experiments/test_scalar_tanh_contraction.py",
]
limitations = [
  "一つのスカラー系、決定論的入力、有限時間のground-truth検証である。",
  "この十分条件は|a|>=1でのESP不存在を意味しない。",
  "計算能力または記憶能力の優位性は検証していない。",
]
falsification_criteria = [
  "同じ実験specと数値精度で、観測距離が許容誤差を超えて解析上界に違反する。",
]

[[claims]]
id = "C-RC-005"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "スカラーtanh系で負の有限時間条件付きLyapunov指数を観測しても、複数初期状態が異なる安定応答へ残る場合があり、局所安定性だけでは大域的一意性を保証しない。"
sources = [
  "https://doi.org/10.1162/NECO_a_00411",
  "https://doi.org/10.1016/j.physd.2020.132609",
]
implementations = [
  "src/reservoir_dynamics/metrics/conditional_lyapunov.py",
  "src/reservoir_dynamics/experiments/input_conditioned_stability_sweep.py",
]
tests = [
  "tests/metrics/test_conditional_lyapunov.py",
  "tests/experiments/test_input_conditioned_stability_sweep.py",
]
limitations = [
  "一つのスカラー系、一つの入力seed、有限時間の結果である。",
  "条件付き指数は一つの参照軌道に沿って評価した。",
  "echo indexそのものはまだ推定していない。",
]
falsification_criteria = [
  "同じspecで全replicaが同期し、非同期結果が数値実装の誤りと判明する。",
]

[[claims]]
id = "C-RC-006"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "スカラーtanh系では|a|<1の大域収縮条件を満たさなくても、今回の共通入力によりreplica同期が生じた。"
sources = [
  "https://doi.org/10.1162/NECO_a_00411",
  "https://doi.org/10.1016/j.neunet.2012.07.005",
]
implementations = [
  "src/reservoir_dynamics/systems/scalar_tanh.py",
  "src/reservoir_dynamics/experiments/input_conditioned_stability_sweep.py",
]
tests = [
  "tests/systems/test_scalar_tanh.py",
  "tests/experiments/test_input_conditioned_stability_sweep.py",
]
limitations = [
  "同期は特定の入力分布、seed、有限時間、閾値に条件付けられている。",
  "大域的ESPを一般入力について証明したものではない。",
]
falsification_criteria = [
  "同じ入力と初期状態集合で、許容誤差を超えるreplica分離が再現する。",
]

[[claims]]
id = "H-RC-001"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "入力駆動フィルタ課題では、自律アトラクタ数よりreplica consistency、条件付き安定性、課題整合IPC/TIPCが未知条件の性能をよく予測する。"
falsification_criteria = [
  "条件付き安定性と容量を統制した階層モデルで、自律アトラクタ数が複数の未知task familyにわたり一貫して最良の予測子になる。",
]
limitations = ["タスクの種類と入力分布を事前に層別化する必要がある。"]

[[claims]]
id = "H-RC-002"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "連想記憶性能は、生のアトラクタ数より実効レパートリー、吸引域保持曲線、識別性、偽アトラクタ率でよく説明できる。"
falsification_criteria = [
  "吸引域分布と識別性を操作・統制しても、生の個数のみが未知cue条件で最良の予測子になる。",
]

[[claims]]
id = "H-RC-003"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "metastable state間の遷移時間尺度とタスクが要求する保持時間が整合するとき、性能が最大になる。"
falsification_criteria = [
  "タスク遅延を変えても、MFPTまたはimplied timescaleに対する性能ピークが系統的に移動しない。",
]

[[claims]]
id = "H-RC-004"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "アトラクタprofileを目的に含む多目的調整は、同じ探索予算の性能損失単独調整より未知条件で頑健になる。"
falsification_criteria = [
  "同一探索予算と同一読み出しで、未知seed、未知入力分布、未知力学系familyのいずれにも改善がない。",
]

[[claims]]
id = "H-RC-005"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "Generalized RCで必要な読み出し複雑度は、観測不能なタスク非関連自由度と条件付き不安定性の増大に伴って増える。"
falsification_criteria = [
  "可観測性と条件付き不安定性を独立に操作しても、必要な履歴長、パラメータ数、学習標本数に再現可能な変化がない。",
]

[[claims]]
id = "C-RC-007"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "8次元tanh RNNの3 seed pilotで、負の最大条件付きLyapunov指数とreplica非同期が9条件で共存し、局所摂動減衰だけでは大域的な入力応答一意性を保証しなかった。"
sources = [
  "https://doi.org/10.1162/NECO_a_00411",
  "https://doi.org/10.1016/j.physd.2020.132609",
]
implementations = [
  "src/reservoir_dynamics/systems/tanh_rnn.py",
  "src/reservoir_dynamics/metrics/top_conditional_lyapunov.py",
  "src/reservoir_dynamics/experiments/multidimensional_memory_sweep.py",
]
tests = [
  "tests/systems/test_tanh_rnn.py",
  "tests/metrics/test_top_conditional_lyapunov.py",
  "tests/experiments/test_multidimensional_memory_sweep.py",
]
limitations = [
  "直交再帰核、8次元、3 seed、有限時間に限定したpilotである。",
  "最大条件付き指数はzero初期状態からの一つの参照軌道に沿って評価した。",
  "replica集合は4個の決定論的初期状態であり、吸引域分布を標本化していない。",
]
falsification_criteria = [
  "同じspecで非同期結果が再現せず、数値実装または閾値設定の誤りと判明する。",
]

[[claims]]
id = "C-RC-008"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "EXP-2026-003ではrecurrent gain 1.2と1.5の全seedで、input gain 1.5がreplica同期を回復した一方、低recurrent gainでは強入力に伴う線形記憶容量低下を観測した。"
sources = [
  "https://doi.org/10.1016/j.neunet.2012.07.005",
  "https://doi.org/10.24406/publica-fhg-291107",
]
implementations = [
  "src/reservoir_dynamics/metrics/linear_memory.py",
  "src/reservoir_dynamics/experiments/multidimensional_memory_sweep.py",
]
tests = [
  "tests/metrics/test_linear_memory.py",
  "tests/experiments/test_multidimensional_memory_sweep.py",
]
limitations = [
  "同期回復と記憶低下は同じinput gain操作により同時に変化しており、媒介関係を識別していない。",
  "線形遅延記憶だけを評価し、非線形情報処理容量とtask性能は未測定である。",
]

[[claims]]
id = "C-RC-009"
status = "provisional"
evidence_type = "local_reproduction"
statement = "EXP-2026-003の直交tanh RNNでは、最良のseed平均線形記憶容量はtop条件付き指数が0に近い条件ではなく、recurrent gain 0.6、input gain 0.1の強い収縮条件で得られた。"
sources = [
  "https://doi.org/10.24406/publica-fhg-291107",
  "https://doi.org/10.1038/srep00514",
]
implementations = [
  "src/reservoir_dynamics/metrics/linear_memory.py",
  "src/reservoir_dynamics/experiments/multidimensional_memory_sweep.py",
]
tests = [
  "tests/metrics/test_linear_memory.py",
  "tests/experiments/test_multidimensional_memory_sweep.py",
]
limitations = [
  "3 seedかつ単一network familyの探索的結果であり、edge-of-chaos仮説一般への反証ではない。",
  "有限test標本では相関係数二乗の総和に正方向biasがあり、最大値が状態次元をわずかに超えた。",
]
falsification_criteria = [
  "30 seed以上、複数network family、標本bias補正後に、同期領域のedge近傍が一貫して優越する。",
]

[[claims]]
id = "C-RC-010"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "EXP-2026-004の8次元直交tanh RNNでは、30対応seedにおける(0.6, 0.1)の局所線形記憶容量が(0.9, 0.5)を平均0.7356、bootstrap 95%区間[0.6305, 0.8467]で上回った。"
sources = [
  "https://doi.org/10.1007/s12064-011-0146-8",
  "https://doi.org/10.1103/PhysRevE.100.062312",
  "https://doi.org/10.1063/5.0038163",
]
implementations = [
  "src/reservoir_dynamics/metrics/bootstrap.py",
  "src/reservoir_dynamics/metrics/linear_memory.py",
  "src/reservoir_dynamics/experiments/replica_readout_validation.py",
]
tests = [
  "tests/metrics/test_bootstrap.py",
  "tests/metrics/test_linear_memory.py",
  "tests/experiments/test_replica_readout_validation.py",
]
limitations = [
  "単一の直交tanh RNN family、8次元、12遅延の線形記憶課題に限定される。",
  "edge-of-chaos一般への反証ではなく、比較した2条件間の局所結果である。",
  "有限標本のlocal memoryは相関係数二乗に由来する正方向biasを含み得る。",
]
falsification_criteria = [
  "独立seedによる同一specの確認実験で、対応差の95%区間が0以下を含む。",
]

[[claims]]
id = "C-RC-011"
status = "reproduced"
evidence_type = "local_reproduction"
statement = "EXP-2026-004ではinput gainを1.5へ上げると、recurrent gain 1.2と1.5の両方で同期率が平均0.7333改善し、shared worst容量もそれぞれ3.6703と2.6191改善した。"
sources = [
  "https://doi.org/10.1162/NECO_a_00411",
  "https://doi.org/10.1016/j.physd.2020.132609",
]
implementations = [
  "src/reservoir_dynamics/metrics/replica.py",
  "src/reservoir_dynamics/metrics/linear_memory.py",
  "src/reservoir_dynamics/experiments/replica_readout_validation.py",
]
tests = [
  "tests/metrics/test_replica.py",
  "tests/metrics/test_linear_memory.py",
  "tests/experiments/test_replica_readout_validation.py",
]
limitations = [
  "同期と容量の改善は同じinput gain介入に伴うため、媒介効果を分離していない。",
  "入力分布、初期状態集合、有限時間、同期閾値に条件付けられる。",
]
falsification_criteria = [
  "独立seedによる同一specで、いずれかの同期率差の95%区間下限が0以下になる。",
]

[[claims]]
id = "C-RC-012"
status = "provisional"
evidence_type = "local_reproduction"
statement = "EXP-2026-004の非同期を含む条件間で固定readout retentionは大きく異なり、(1.5, 0.1)では平均0.0892、(1.5, 1.5)では平均0.9962だったため、状態非同期だけでは遅延記憶task上の有害性を決定できなかった。"
sources = [
  "https://doi.org/10.1063/1.5079686",
  "https://arxiv.org/abs/2412.12104",
]
implementations = [
  "src/reservoir_dynamics/metrics/linear_memory.py",
  "src/reservoir_dynamics/experiments/replica_readout_validation.py",
]
tests = [
  "tests/metrics/test_linear_memory.py",
  "tests/experiments/test_replica_readout_validation.py",
]
limitations = [
  "二条件はinput gainも異なるため、状態同期率から独立した因果効果ではない。",
  "事前登録した絶対shared penalty基準は不成立であり、本記述は探索的な条件差である。",
  "固定線形readoutと遅延記憶taskに限定され、任意taskの機能同値性を意味しない。",
]
falsification_criteria = [
  "独立seedとnetwork familyで、状態非同期条件のretention差が再現しない。",
  "(1.5, 0.1)型条件のretention 95%区間上限が事前登録値0.25未満にならない。",
]

[[claims]]
id = "H-RC-006"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "raw state attractorを固定readoutとtask scoreが誘導する機能同値類へまとめた商構造は、replica距離または自律アトラクタ数だけより、未知初期状態で利用できる計算能力をよく予測する。"
sources = [
  "https://doi.org/10.1063/1.5079686",
  "https://arxiv.org/abs/2412.12104",
]
implementations = [
  "src/reservoir_dynamics/metrics/linear_memory.py",
]
tests = [
  "tests/metrics/test_linear_memory.py",
]
limitations = [
  "機能的商という整理概念は本研究の提案であり、同値関係の一般的性質と推定一致性は未証明である。",
  "readout、task、許容誤差を変えると同値類も変わる。",
]
falsification_criteria = [
  "複数network familyと未知taskで、global/output consistencyを含むbaselineへ機能的商の指標を加えても未知初期状態性能の増分予測力がない。",
]

[[claims]]
id = "C-BIO-001"
status = "established"
evidence_type = "sourced_fact"
statement = "神経回路の全結合をゲノムが個別指定する代わりに、低次元な発生・結線規則が複雑な回路を生成するgenomic bottleneckという枠組みと、その計算モデルが提案されている。"
sources = [
  "https://doi.org/10.1038/s41467-019-11786-6",
  "https://doi.org/10.1038/s41467-023-37980-1",
  "https://doi.org/10.1073/pnas.2409160121",
]
limitations = [
  "genomic bottleneckは有力な枠組みだが、個々の生物種の全神経回路が同一方式で符号化されることを証明していない。",
  "人工networkでの圧縮とtransfer性能は、生物学的発生機構そのものの再現ではない。",
]

[[claims]]
id = "C-BIO-002"
status = "established"
evidence_type = "sourced_fact"
statement = "神経系発生では保存される構造的scaffoldと個体差・発生依存の結合変化が共存し、CA3では発生に伴う疎で構造化された再帰結合への変化が報告されている。"
sources = [
  "https://doi.org/10.1038/s41586-021-03778-8",
  "https://doi.org/10.1038/s41467-026-71914-x",
]
limitations = [
  "線虫全脳とmouse CA3の結果を、人間全脳へ直接一般化できない。",
  "遺伝的指定と経験依存塑性の寄与率は回路、発生時期、種により異なる。",
]

[[claims]]
id = "H-BIO-001"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "圧縮された発生generatorが機能コアとplastic reserveを同時生成するnetworkは、同じ記述長、学習標本、更新量のrandom初期networkより、学習前性能、適応速度、core保持をPareto改善する。"
falsification_criteria = [
  "未知task familyと未知seedで、random初期化または全結合学習が同じbudget下でPareto frontierを一貫して支配する。",
]
limitations = [
  "plastic reserveの操作定義とbudgetの公平な対応付けを事前規定する必要がある。",
]

[[claims]]
id = "H-BIO-002"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "有用な力学的余剰は未使用アトラクタの静的個数ではなく、既存core性能を許容範囲内に保ちながら新しい安定応答を形成できる制約付き適応容量である。"
falsification_criteria = [
  "複数network familyとtask familyで、静的アトラクタ数が制約付き適応容量より新規学習、忘却、頑健性を一貫してよく予測する。",
]

[[claims]]
id = "H-BIO-003"
status = "hypothesis"
evidence_type = "hypothesis"
statement = "人間規模の処理能力に必要な条件は、状態数だけでなく、task組合せ複雑度、可塑的余剰、時間尺度階層、bandwidth、energy、頑健性、発生記述長の同時制約として下界化できる。"
falsification_criteria = [
  "小規模から大規模へのscaling lawがnetwork family間で安定せず、生物データまたは未知scaleを予測できない。",
